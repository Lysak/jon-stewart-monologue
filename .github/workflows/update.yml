name: Update monologues

on:
  schedule:
    - cron: "17 * * * *" # hourly; off the top of the hour, when GitHub's scheduler is busiest
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  # GitHub publishes runner labels before `ubuntu-latest` migrates to them. Pick the newest
  # Ubuntu LTS from that list every run: today 26.04, and 28.04 the moment it is available.
  # No hardcoded version means nothing can go stale.
  runner:
    runs-on: ubuntu-latest
    outputs:
      label: ${{ steps.pick.outputs.label }}
    steps:
      - id: pick
        run: |
          label=$(curl -fsSL --max-time 20 https://raw.githubusercontent.com/actions/runner-images/main/README.md \
            | grep -oE '`ubuntu-[0-9]{2}\.[0-9]{2}`' | tr -d '`' | sort -V | tail -1) || true
          echo "label=${label:-ubuntu-latest}" >> "$GITHUB_OUTPUT"
          echo "Using ${label:-ubuntu-latest}"

  update:
    needs: runner
    runs-on: ${{ needs.runner.outputs.label }}
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x" # latest stable
      # videos.json, clef.json and last-changed.txt are generated state: they live on the `data` branch, so main stays human-only.
      - name: Restore state from the data branch
        run: |
          if git fetch --quiet origin "+refs/heads/data:refs/remotes/origin/data"; then
            git checkout refs/remotes/origin/data -- data/videos.json data/clef.json data/last-changed.txt
            echo "Restored state from the data branch."
          else
            echo "No data branch yet; starting from scratch."
          fi
      - run: python3 -m unittest discover -s tests
      - run: python3 scripts/update.py
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Save state to the data branch
        run: |
          state="$RUNNER_TEMP/state"
          if git rev-parse --verify --quiet refs/remotes/origin/data >/dev/null; then
            git branch --force data refs/remotes/origin/data
            git worktree add --quiet "$state" data
          else
            git worktree add --quiet --detach "$state"
            git -C "$state" switch --quiet --orphan data
          fi
          mkdir -p "$state/data"
          cp data/videos.json data/clef.json data/last-changed.txt "$state/data/"
          git -C "$state" add data
          if ! git -C "$state" diff --cached --quiet; then
            git -C "$state" -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit --quiet -m "Update videos"
            git -C "$state" push --quiet origin data
          fi
      # Candidates never reach the public page. One open issue is the review queue; it closes once
      # overrides settle every candidate. A candidate that appears while the issue is open waits for
      # the next issue cycle (ponytail), but it is never shown on the site.
      - name: Flag videos that need review
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.repository }}
        run: |
          list=$(jq -r '.[] | select(.status == "candidate") | "- [\(.title)](https://www.youtube.com/watch?v=\(.id)) `\(.id)`"' data/videos.json)
          open=$(gh issue list --label needs-review --state open --json number --jq '.[].number')
          if [ -z "$list" ]; then
            for n in $open; do gh issue close "$n" --comment "All settled."; done
          elif [ -z "$open" ]; then
            gh label create needs-review --color d93f0b 2>/dev/null || true
            printf '@%s these videos have no "TDS Welcome" chapter and Clef is unsure:\n\n%s\n\nTo settle each video, edit [data/overrides.json](https://github.com/%s/edit/main/data/overrides.json):\n\n- add the id to `include` if it is a monologue;\n- add the id to `exclude` if it is not.\n\nThe next run applies the change; this issue closes once no candidates are left.\n' \
              "$OWNER" "$list" "$REPO" > body.md
            gh issue create --title "Needs review: $(echo "$list" | wc -l | tr -d ' ') videos" --label needs-review --body-file body.md
          fi
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .

  # Deploy every run, including hourly scheduled ones: `data/status.json` carries the last check
  # time, and the page can only show it once that file is published. The data branch still only
  # receives a commit when videos.json, clef.json or last-changed.txt actually differ.
  deploy:
    needs: [runner, update]
    runs-on: ${{ needs.runner.outputs.label }}
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
